<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Information</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #232323;
            color: #ffffff;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .company-name {
            color: #b0b0b0;
            font-size: 14px;
            font-weight: 500;
        }

        .app-logo img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .app-logo-icon {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #232323;
            font-size: 10px;
            font-weight: bold;
            line-height: 1;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 24px 20px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #e0e0e0;
        }

        .field {
            margin-bottom: 18px;
        }

        .field-label {
            color: #888888;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .field-value {
            background-color: #333333;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: #ffffff;
            word-break: break-word;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .buttons-row {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            background-color: #333333;
            border: 1px solid #555555;
            border-radius: 8px;
            padding: 12px 0;
            color: #e0e0e0;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn:not(:disabled):hover {
            background-color: #444444;
            border-color: #888888;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
            padding: 20px 10px 10px;
        }

        .share-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 5px;
        }

        .share-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-left">
            <img class="logo-img" src="assets/images/BMI Logo.png" alt="BMI Logo" />Biomed Ingredients Pvt. Ltd
        </div>
        <div class="app-logo">
            <img src="assets/images/label.png" alt="Label Gen" />
        </div>
    </div>

    <div class="card">
        <h2>Product Information</h2>

        <div id="fields-container">
            <!-- Fields will be injected here via JS -->
            <div class="field" style="text-align: center; color: #888;">
                Loading data...
            </div>
        </div>

        <div class="buttons-row">
            <button class="btn" id="coa-btn" onclick="openDoc('coa')" disabled>
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                COA
            </button>
            <button class="btn" id="spec-btn" onclick="openDoc('spec')" disabled>
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                Specification
            </button>
        </div>
    </div>

    <div class="footer">
        <button class="share-btn" onclick="shareData()">
            <svg viewBox="0 0 24 24">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                <polyline points="16 6 12 2 8 6"></polyline>
                <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
        </button>
    </div>

    <script>
        // Field mappings to nice labels
        const labelMap = {
            "product": "Product Name",
            "batch": "Batch No.",
            "mfg_date": "Manufacturing Date",
            "exp_date": "Expire Date",
            "total_quantity": "Total Quantity",
            "fssai": "FSSAI No.",
            "usfda": "USFDA No.",
            "origin": "Origin"
        };

        // Store document URLs globally
        let docUrls = { coa: null, spec: null };

        function openDoc(type) {
            const url = docUrls[type];
            if (url) {
                window.open(url, '_blank');
            } else {
                alert(type.toUpperCase() + ' document not attached.');
            }
        }

        function parseData() {
            try {
                // Try to get data from URL parameter '?d='
                const urlParams = new URLSearchParams(window.location.search);
                const d = urlParams.get('d');

                let values = {};

                if (d) {
                    // Decode base64 and parse JSON
                    const jsonString = decodeURIComponent(escape(atob(d)));
                    values = JSON.parse(jsonString);
                } else {
                    // Fallback mock data for testing visually
                    values = {
                        "product": "Phosphatidylserine",
                        "batch": "YL-29-20260802",
                        "mfg_date": "02-Aug-2026",
                        "exp_date": "01-Aug-2028",
                    };
                }

                renderFields(values);

            } catch (error) {
                document.getElementById('fields-container').innerHTML =
                    `<div class="field" style="color: #ff6b6b;">Error loading data: Invalid format.</div>`;
                console.error(error);
            }
        }

        function renderFields(values) {
            const container = document.getElementById('fields-container');
            container.innerHTML = '';

            // Wire up document buttons
            if (values['coa_url'] && values['coa_url'].trim() !== '') {
                docUrls.coa = values['coa_url'];
                const btn = document.getElementById('coa-btn');
                if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
            }
            if (values['spec_url'] && values['spec_url'].trim() !== '') {
                docUrls.spec = values['spec_url'];
                const btn = document.getElementById('spec-btn');
                if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
            }

            // Define order
            const order = ['product', 'batch', 'mfg_date', 'exp_date', 'total_quantity', 'fssai', 'usfda', 'origin'];

            // Render ordered fields
            order.forEach(key => {
                if (values[key] && values[key].trim() !== '') {
                    addField(container, labelMap[key] || key, values[key]);
                }
            });

            // Render any extra fields not in order
            const unwanted = ['net_wt', 'gross_wt', 'drum_capacity', 'drum', 'drum_label_text', 'custom_tare', 'last_drum_label_text', 'coa_url', 'spec_url'];
            Object.keys(values).forEach(key => {
                if (!order.includes(key) && !unwanted.includes(key) && values[key] && values[key].trim() !== '') {
                    addField(container, key.replace(/_/g, ' '), values[key]);
                }
            });

            if (container.innerHTML === '') {
                container.innerHTML = `<div class="field" style="color: #888;">No data available</div>`;
            }
        }

        function addField(container, label, value) {
            const fieldDiv = document.createElement('div');
            fieldDiv.className = 'field';

            const labelDiv = document.createElement('div');
            labelDiv.className = 'field-label';
            labelDiv.innerText = label.toUpperCase(); // Optional uppercase
            // Or just capitalize first letter:
            labelDiv.innerText = label.charAt(0).toUpperCase() + label.slice(1);

            const valueDiv = document.createElement('div');
            valueDiv.className = 'field-value';
            valueDiv.innerText = value;

            fieldDiv.appendChild(labelDiv);
            fieldDiv.appendChild(valueDiv);
            container.appendChild(fieldDiv);
        }

        function shareData() {
            if (navigator.share) {
                navigator.share({
                    title: 'Product Information',
                    text: 'Check out this product label information',
                    url: window.location.href,
                }).catch(console.error);
            } else {
                alert("Sharing is not supported on this browser. Copy the URL instead.");
            }
        }

        // Initialize
        parseData();
    </script>
</body>

</html>
